{% for group, fields in groups %}<details class="field-group" {% if group == 'Track' or group == 'Release' %}open{% endif %}><summary>{{ group }}</summary>{% for item in fields %}<div class="tag-field" data-key="{{ item.field.key }}"><label for="field-{{ item.field.key }}">{% if is_bulk %}<input type="checkbox" name="include_{{ item.field.key }}" aria-label="Include {{ item.field.label }}">{% endif %}{{ item.field.label }}{% if item.field.multi %}<small>multiple · separated by ;</small>{% endif %}</label>{% if item.field.kind == 'longtext' %}<textarea id="field-{{ item.field.key }}" name="field_{{ item.field.key }}" rows="4" {% if not unlocked %}readonly{% endif %}>{{ item.value }}</textarea>{% else %}<input id="field-{{ item.field.key }}" name="field_{{ item.field.key }}" value="{{ item.value }}" placeholder="{% if item.mixed %}Mixed — include to change{% endif %}" {% if not unlocked %}readonly{% endif %} {% if item.field.multi %}data-multi="true"{% endif %}>{% endif %}{% if is_bulk %}<select name="mode_{{ item.field.key }}" aria-label="{{ item.field.label }} operation"><option value="replace">Replace</option>{% if item.field.multi %}<option value="add">Add</option><option value="remove">Remove</option>{% endif %}<option value="clear">Clear</option></select>{% else %}<input type="hidden" name="dirty_{{ item.field.key }}" value="">{% endif %}</div>{% endfor %}</details>{% endfor %}
