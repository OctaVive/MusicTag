{% if error %}<p class="error">{{ error }}</p>{% endif %}{% for release in releases %}<article class="lookup-result"><strong>{{ release.title }}</strong><span>{{ release.date }} · {{ release.country }} · {{ release.status }}</span><button type="button" data-release="{{ release.id }}">Use this release</button><a href="https://coverartarchive.org/release/{{ release.id }}" target="_blank" rel="noreferrer">Cover candidates ↗</a></article>{% empty %}<p class="muted">No release results.</p>{% endfor %}
