{% load library_tags %}{% if page.has_other_pages %}<nav class="pagination" aria-label="Pagination">{% if page.has_previous %}<a href="{% query page=page.previous_page_number %}" hx-get="{% query page=page.previous_page_number %}" hx-target="#workspace" hx-push-url="true">← Previous</a>{% endif %}<span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="{% query page=page.next_page_number %}" hx-get="{% query page=page.next_page_number %}" hx-target="#workspace" hx-push-url="true">Next →</a>{% endif %}</nav>{% endif %}
