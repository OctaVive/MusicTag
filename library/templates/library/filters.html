<form class="filters" method="get" hx-get="{{ request.path }}" hx-target="#workspace" hx-push-url="true" hx-trigger="change, submit">
<input type="hidden" name="q" value="{{ request.GET.q }}">
<select name="format" aria-label="Format"><option value="">All formats</option><option value="mp3" {% if request.GET.format == 'mp3' %}selected{% endif %}>MP3</option><option value="flac" {% if request.GET.format == 'flac' %}selected{% endif %}>FLAC</option><option value="wav" {% if request.GET.format == 'wav' %}selected{% endif %}>WAV</option></select>
<select name="cover" aria-label="Artwork"><option value="">Any artwork</option><option value="no" {% if request.GET.cover == 'no' %}selected{% endif %}>Missing artwork</option><option value="yes" {% if request.GET.cover == 'yes' %}selected{% endif %}>Has artwork</option></select>
<select name="issue" aria-label="Missing field"><option value="">Any quality</option><option value="missing_title" {% if request.GET.issue == 'missing_title' %}selected{% endif %}>Missing title</option><option value="missing_artist" {% if request.GET.issue == 'missing_artist' %}selected{% endif %}>Missing artist</option><option value="missing_album" {% if request.GET.issue == 'missing_album' %}selected{% endif %}>Missing album</option><option value="missing_albumartist" {% if request.GET.issue == 'missing_albumartist' %}selected{% endif %}>Missing album artist</option><option value="duplicate_tracknumber" {% if request.GET.issue == 'duplicate_tracknumber' %}selected{% endif %}>Duplicate numbers</option><option value="read_error" {% if request.GET.issue == 'read_error' %}selected{% endif %}>Read errors</option></select>
<input name="artist" placeholder="Artist" aria-label="Artist filter" value="{{ request.GET.artist }}"><input name="genre" placeholder="Genre" aria-label="Genre filter" value="{{ request.GET.genre }}"><input name="year" placeholder="Year" aria-label="Year filter" value="{{ request.GET.year }}" size="4"><button type="submit" class="subtle">Filter</button><a href="{{ request.path }}" class="muted">Clear all</a></form>
